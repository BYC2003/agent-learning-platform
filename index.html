<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent 应用开发学习平台 · 0 基础到入职</title>
<meta name="description" content="24 周 Agent 应用开发学习路线：任务打卡、练习、作品集看板、面试题库与学习日志，全部本地保存。">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- 左上角品牌 -->
  <header class="brand">
    <div class="brand-logo">A</div>
    <div class="brand-text">
      <div class="brand-title" id="brandTitle">Agent 学习平台</div>
      <div class="brand-sub" id="brandSub">0 基础 → 可入职</div>
    </div>
  </header>

  <!-- 顶栏 -->
  <div class="topbar">
    <button class="icon-btn" id="menuBtn" title="菜单" style="display:none">≡</button>
    <div class="search-wrap">
      <input type="search" id="searchInput" placeholder="搜索任务、练习、知识点…" autocomplete="off">
    </div>
    <div class="topbar-spacer"></div>

    <div class="timer" id="timer">
      <span class="timer-display" id="timerDisplay">25:00</span>
      <button id="timerToggle" title="开始 / 暂停">开始</button>
      <button id="timerReset" title="重置">重置</button>
    </div>

    <div class="global-progress" title="总进度">
      <div class="bar" id="globalBar"><i></i></div>
      <span class="pct" id="globalPct">0%</span>
    </div>

    <button class="icon-btn" id="themeBtn" title="切换主题">◐</button>
    <button class="icon-btn" id="exportBtn" title="导出学习进度">↓</button>
    <button class="icon-btn" id="importBtn" title="导入学习进度">↑</button>
    <button class="icon-btn" id="resetBtn" title="清空所有进度">×</button>
  </div>

  <!-- 侧边导航 -->
  <aside class="sidebar" id="sidebar">
    <div class="nav-section-title">总览</div>
    <button class="nav-item" data-view="dashboard">
      <span class="nav-no">HOME</span>
      <span class="nav-label">学习总览</span>
    </button>

    <div class="nav-section-title">学习路线</div>
    <div id="stageNav"></div>

    <div class="nav-section-title">动手做项目</div>
    <button class="nav-item" data-view="tutorials">
      <span class="nav-no">实战</span>
      <span class="nav-label">项目实战教程</span>
      <span class="nav-count" id="tutNavCount"></span>
    </button>

    <button class="nav-item" data-view="sync">
      <span class="nav-no">同步</span>
      <span class="nav-label">云同步进度</span>
      <span class="nav-count" id="syncNavCount"></span>
    </button>

    <div class="nav-section-title">输出与求职</div>
    <button class="nav-item" data-view="projects">
      <span class="nav-no">作品</span>
      <span class="nav-label">作品集看板</span>
      <span class="nav-count" id="projNavCount"></span>
    </button>
    <button class="nav-item" data-view="interview">
      <span class="nav-no">面试</span>
      <span class="nav-label">面试题库</span>
      <span class="nav-count" id="intNavCount"></span>
    </button>
    <button class="nav-item" data-view="log">
      <span class="nav-no">日志</span>
      <span class="nav-label">学习日志</span>
      <span class="nav-count" id="logNavCount"></span>
    </button>
  </aside>

  <!-- 主内容 -->
  <main class="main" id="main">
    <div class="content">

      <section class="view" id="view-dashboard"></section>
      <section class="view" id="view-stage"></section>
      <section class="view" id="view-tutorials"></section>
      <section class="view" id="view-sync"></section>
      <section class="view" id="view-projects"></section>
      <section class="view" id="view-interview"></section>
      <section class="view" id="view-log"></section>
      <section class="view" id="view-search"></section>

    </div>
  </main>

</div>

<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="data.js"></script>
<script src="personal.js"></script>
<script src="tutorials.js"></script>
<script src="app.js"></script>
<script src="sync.js"></script>
</body>
</html>
